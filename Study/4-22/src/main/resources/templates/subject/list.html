<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .subject-group { margin-bottom: 4rem; }
        .subject-title { 
            border-left: 5px solid #0d6efd; 
            padding-left: 15px; 
            font-size: 1.25rem;
            font-weight: bold;
        }
        .progress-card { 
            border-radius: 12px; 
            border: none !important;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            background-color: #ffffff;
        }
        .btn-custom { border-radius: 8px; font-weight: 600; font-size: 0.85rem; }
        /* 削除ボタンの微調整 */
        .btn-delete-subject {
            padding: 0 8px;
            color: #dc3545;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .btn-delete-subject:hover {
            opacity: 1;
            background: none;
            color: #a71d2a;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="fw-bold text-dark">学習一覧</h1>
        <a th:href="@{/subject/add}" class="btn btn-success btn-lg shadow-sm btn-custom">
            <i class="bi bi-plus-circle-fill me-2"></i>新しい科目を追加
        </a>
    </div>

    <div class="row">
        <div class="col-md-6 subject-group" th:each="subject : ${subjectList}">
            
            <div class="d-flex align-items-center mb-3">
                <h3 class="subject-title text-dark mb-0" th:text="${subject.title}">科目名</h3>
                
                <form th:action="@{/subject/delete/{id}(id=${subject.id})}" method="post" 
                      onsubmit="return confirm('科目を削除すると、これまでの学習履歴もすべて消去されます。本当によろしいですか？');">
                    <button type="submit" class="btn btn-link btn-delete-subject" title="科目を削除">
                        <i class="bi bi-trash3"></i>
                    </button>
                </form>
            </div>

            <div class="card progress-card h-100">
                <div class="card-body p-3 d-flex flex-column justify-content-between">
                    
                    <div class="mb-2">
                        <div class="d-flex justify-content-between align-items-end mb-1">
                            <span class="text-secondary small fw-bold" style="font-size: 0.7rem;">進捗率</span>
                            <span class="h5 fw-bold text-primary mb-0" th:text="${subject.progressPercent} + '%'">0%</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar bg-success" 
                                 role="progressbar" 
                                 th:style="'width: ' + ${subject.progressPercent} + '%'"></div>
                        </div>
                        <div class="mt-1 small text-muted text-end" style="font-size: 0.75rem;">
                            <span class="fw-bold text-dark" th:text="${subject.currentPage}">0</span> / 
                            <span th:text="${subject.totalPages}">0</span>  完了
                        </div>
                    </div>

                    <div class="pt-2 border-top">
                        <div class="row align-items-center g-2">
                            <div class="col-4 text-start">
                                <p class="text-muted mb-0" style="font-size: 0.7rem;"><i class="bi bi-clock-history"></i> 学習時間</p>
                                <span class="h5 fw-bold text-dark" th:text="${subject.totalDuration}">0</span> 
                                <span class="text-muted small">分</span>
                            </div>
                            <div class="col-8 d-grid gap-1">
                                <a th:href="@{/subject/record/{id}(id=${subject.id})}" class="btn btn-success btn-sm btn-custom py-1 shadow-sm">
                                    <i class="bi bi-pencil-fill me-1"></i> 今日の勉強を記録
                                </a>
                                <a th:href="@{/subject/history/{id}(id=${subject.id})}" class="btn btn-primary btn-sm btn-custom py-1 shadow-sm">
                                    <i class="bi bi-journal-text me-1"></i> 履歴・詳細
                                </a>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    
    <div th:if="${#lists.isEmpty(subjectList)}" class="text-center py-5 shadow-sm bg-white rounded-4 mt-4">
        <i class="bi bi-folder-plus display-1 text-muted opacity-25"></i>
        <p class="h4 text-muted mt-3">まだ科目が登録されていません</p>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習履歴</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .card { border-radius: 12px; }
        .table th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* ボタンを文字表記用に調整 */
        .btn-edit { min-width: 60px; font-weight: 600; }
        .btn-delete { min-width: 60px; font-weight: 600; }
        
        .page-title { border-left: 5px solid #0d6efd; padding-left: 15px; }
    </style>
</head>
<body>
<div class="container py-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title fw-bold text-dark mb-0" th:text="${subject.title} + ' の学習履歴'">科目名 の学習履歴</h2>
        
        <div class="d-flex gap-2">
            <a th:href="@{/subject/list}" class="btn btn-outline-secondary shadow-sm px-4 fw-bold">
                <i class="bi bi-arrow-left me-2"></i>学習一覧へ戻る
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">日時</th>
                            <th>章・単元</th>
                            <th>学習範囲 (P)</th>
                            <th>学習時間</th>
                            <th>メモ</th>
                            <th class="pe-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="record : ${subject.records}">
                            <td class="ps-4" th:text="${#temporals.format(record.startTime, 'MM/dd HH:mm')}"></td>
                            <td class="fw-bold text-dark" th:text="${record.section}"></td>
                            <td>
                                <span class="badge bg-light text-primary border border-primary-subtle" 
                                      th:text="${record.startPage} + ' ～ ' + ${record.endPage} + ' P'"></span>
                            </td>
                            <td>
                                <i class="bi bi-clock text-muted me-1"></i>
                                <span th:text="${record.duration}"></span> 分
                            </td>
                            <td class="small text-muted text-truncate" style="max-width: 250px;" th:text="${record.memo}"></td>
                            
                            <td class="pe-4 text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/subject/record/edit/{id}(id=${record.id})}" 
                                       class="btn btn-outline-primary btn-sm btn-edit">
                                        編集
                                    </a>
                                    
                                    <form th:action="@{/subject/record/delete/{id}(id=${record.id})}" method="post"
                                          onsubmit="return confirm('この学習記録を削除してもよろしいですか？');">
                                        <input type="hidden" name="subjectId" th:value="${subject.id}" />
                                        <button type="submit" class="btn btn-outline-danger btn-sm btn-delete">
                                            削除
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${#lists.isEmpty(subject.records)}" class="text-center py-5">
                <i class="bi bi-journals display-1 text-muted opacity-25"></i>
                <p class="h5 text-muted mt-3">まだ学習記録がありません</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>

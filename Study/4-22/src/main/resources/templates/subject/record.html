<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習記録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center">学習内容の入力</h3>
            <form th:action="@{/subject/record/{id}/save(id=${subjectId})}" th:object="${recordRequest}" method="post">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">学習した章・単元</label>
                    <input type="text" th:field="*{section}" class="form-control" placeholder="第1章 基礎">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">開始時間</label>
                    <div class="input-group">
                        <input type="datetime-local" id="startTime" th:field="*{startTime}" class="form-control">
                        <button type="button" class="btn btn-outline-primary" onclick="setNow('startTime')">開始！</button>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">開始ページ</label>
                        <input type="number" th:field="*{startPage}" class="form-control">
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">終了ページ</label>
                        <input type="number" th:field="*{endPage}" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">終了時間</label>
                    <div class="input-group">
                        <input type="datetime-local" id="endTime" th:field="*{endTime}" class="form-control">
                        <button type="button" class="btn btn-outline-primary" onclick="setNow('endTime')">終了！</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">一言メモ</label>
                    <textarea th:field="*{memo}" class="form-control" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">記録を保存する</button>
                    <a th:href="@{/subject/list}" class="btn btn-link text-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function setNow(id) {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById(id).value = now.toISOString().slice(0, 16);
    }
</script>
</body>
</html>

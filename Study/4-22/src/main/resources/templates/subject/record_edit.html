<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習記録の編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h2 class="fw-bold mb-4">学習記録の編集</h2>
            
            <form th:action="@{/subject/record/edit/{id}(id=${recordId})}" th:object="${studyRecordRequest}" method="post">
                <input type="hidden" name="subjectId" th:value="${subjectId}" />
                
                <div class="mb-3">
                    <label class="form-label">章・単元</label>
                    <input type="text" th:field="*{section}" class="form-control" />
                </div>
                
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">開始ページ</label>
                        <input type="number" th:field="*{startPage}" class="form-control" />
                    </div>
                    <div class="col">
                        <label class="form-label">終了ページ</label>
                        <input type="number" th:field="*{endPage}" class="form-control" />
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">開始時刻</label>
                        <input type="datetime-local" th:field="*{startTime}" class="form-control" />
                    </div>
                    <div class="col">
                        <label class="form-label">終了時刻</label>
                        <input type="datetime-local" th:field="*{endTime}" class="form-control" />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">メモ</label>
                    <textarea th:field="*{memo}" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">更新する</button>
                    <a th:href="@{/subject/history/{id}(id=${subjectId})}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

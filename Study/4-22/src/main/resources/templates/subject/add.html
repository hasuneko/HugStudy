<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>科目ベース登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h2 class="text-center mb-4">新しい科目を登録</h2>
                <form th:action="@{/subject/save}" th:object="${subjectRequest}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">科目名 (例: 数学、Java)</label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="科目名を入力">
                        <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">全体のボリューム (例: 総ページ数)</label>
                        <input type="number" th:field="*{totalPages}" class="form-control" placeholder="500">
                        <div class="text-danger small" th:if="${#fields.hasErrors('totalPages')}" th:errors="*{totalPages}"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">ベースを登録する</button>
                        <a th:href="@{/subject/list}" class="btn btn-outline-secondary">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
